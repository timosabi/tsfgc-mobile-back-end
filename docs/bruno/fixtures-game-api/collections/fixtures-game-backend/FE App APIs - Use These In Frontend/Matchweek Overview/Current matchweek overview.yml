info:
  name: Current matchweek overview
  type: http
  seq: 1700000022000
http:
  method: GET
  url: '{{baseUrl}}/friends-groups/{{friendsGroupId}}/matchweeks/current/overview'
  auth: inherit
settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
docs: >-
  FE placement: first load for the swipeable matchweek dashboard/commentary screen.
  Purpose: backend chooses the active matchweek and returns one full snapshot:
  fixtures, my prediction, revealed member predictions when allowed, selected-matchweek
  scores, members, navigation, permissions, and live chat. Important data meaning:
  scores.rows contains compact selected-matchweek score rows only; there is no
  scores.mine, so FE finds the current user's row by user_id. Season totals are
  returned by the group APIs or leaderboard endpoint, not overview. Notes: read-only;
  no SportMonks or LLM call; poll this every 30-60 seconds when permissions.shouldPoll
  is true.
