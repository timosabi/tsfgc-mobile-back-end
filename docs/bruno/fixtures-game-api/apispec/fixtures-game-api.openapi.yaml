                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Forbidden for the current user.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      security:
      - cookieAuth: []
  "/weekly-score/upsert":
    post:
      tags:
      - Internal - Scoring And Manual Maintenance
      summary: Manual weekly score upsert - internal
      operationId: post_weekly_score_upsert
      description: 'Internal placement: emergency repair/local maintenance only. Purpose:
        manually inserts or updates score rows. Do not call from FE.'
      x-fe-scope: backend-internal
      x-bruno-folder: Backend - Internal Jobs - Do Not Call From FE/Scoring And Manual
        Maintenance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/WeeklyScoreUpsertRequest"
            example:
              weeklyScores:
              - user_id: "{{userId}}"
                friends_group_id: "{{friendsGroupId}}"
                week_number: 1
                fixtures_predicted: 1
                points_earned: 0
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/WeeklyScoreUpsertResponse"
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Forbidden for the current user.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      security:
      - cookieAuth: []
