---
openapi: 3.0.3
info:
  title: Fixtures Game Backend API
  version: 1.0.0
  description: API contract for the no-money football prediction game backend. Use
    `FE - ...` tags for frontend work and `Internal - ...` tags for backend jobs/admin
    maintenance.
servers:
- url: http://localhost:3001
  description: Local backend
tags:
- name: FE - Auth
- name: FE - Groups And Invites
- name: FE - Health
- name: FE - Leaderboard
- name: FE - Matchweek Overview
- name: FE - Prediction Slip
- name: FE - Profile Settings
- name: Internal - Scoring And Manual Maintenance
- name: Internal - SportMonks Hydration And Live Refresh
paths:
  "/weekly-score/calculate-all":
    post:
      tags:
      - Internal - Scoring And Manual Maintenance
      summary: Calculate all finished scores - internal job
      operationId: post_weekly_score_calculate_all
      description: 'Internal placement: scoring cron/manual local test. Purpose: calculates
        all active groups with finished fixtures. FE should only read resulting leaderboard/history
        APIs.'
      x-fe-scope: backend-internal
      x-bruno-folder: Backend - Internal Jobs - Do Not Call From FE/Scoring And Manual
        Maintenance
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CalculateAllScoresResponse"
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Forbidden for the current user.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      security:
      - cookieAuth: []
  "/weekly-score/{friendsGroupId}/calculate":
    post:
      tags:
      - Internal - Scoring And Manual Maintenance
      summary: Calculate matchweek scores - internal job
      operationId: post_weekly_score_friendsGroupId_calculate
      description: 'Internal placement: scoring worker/manual local test after results
        are finished. Purpose: calculates one group matchweek scores. FE should only
        read resulting score/history APIs.'
      x-fe-scope: backend-internal
      x-bruno-folder: Backend - Internal Jobs - Do Not Call From FE/Scoring And Manual
        Maintenance
      parameters:
      - name: friendsGroupId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CalculateScoresRequest"
            example:
              matchweek: "{{matchweek}}"
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ScoreCalculationResponse"
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Authentication required.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '403':
          description: Forbidden for the current user.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '404':
          description: Resource not found.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
      security:
      - cookieAuth: []
  "/match-event":
    post:
      tags:
      - Internal - Scoring And Manual Maintenance
      summary: Manual match event insert - internal
      operationId: post_match_event
      description: 'Internal placement: local maintenance event creation. Purpose:
        inserts raw match event data. Do not call from FE.'
      x-fe-scope: backend-internal
      x-bruno-folder: Backend - Internal Jobs - Do Not Call From FE/Scoring And Manual
        Maintenance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/MatchEventRequest"
            example:
              fixture_id: "{{fixtureId}}"
              event_type: goal
              minute: 10
              player_name: Test Player
              team: Home
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/MatchEventResponse"
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ErrorResponse"
        '401':
          description: Authentication required.
          content:
            application/json:
