      - FE - Groups And Invites
      summary: Create friends group with subscription
      operationId: post_friends_groups
      description: 'FE placement: submit button on create-friends-group screen. Purpose:
        creates an approved friends group immediately, activates the selected football
        subscription, adds creator as member, hydrates fixtures, and returns invite_token/joinLink.
        Notes: user can own only one group; accessType must be open or private.'
      x-fe-scope: frontend
      x-bruno-folder: FE App APIs - Use These In Frontend/Groups And Invites
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreateFriendsGroupRequest"
            example:
              payload:
                name: Local Test Group
                slug: "{{friendsGroupSlug}}"
                accessType: open
                subscription:
                  providerLeagueId: "{{providerLeagueId}}"
      responses:
